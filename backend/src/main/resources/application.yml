
spring:
  config:
    # Load local backend environment variables from backend/.env
    import: optional:file:.env[.properties]

  application:
    name: farm-marketplace

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/farm_marketplace_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-change-in-production}
    expiration: 604800000 # 7 days in milliseconds

  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

  ozow:
    site-code: ${OZOW_SITE_CODE:}
    api-key: ${OZOW_API_KEY:}
    private-key: ${OZOW_PRIVATE_KEY:}
    base-url: ${OZOW_BASE_URL:https://api.ozow.com}

  listing:
    default-fee: 1.00 # R1 per day per product

server:
  port: ${PORT:8080}